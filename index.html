        }

        initThree() {
          this.renderer = new THREE.WebGLRenderer({
            canvas: this.dom.canvas,
            antialias: this.perf.tier !== 'LOW',
            alpha: true,
            powerPreference: 'high-performance'
          });
          this.renderer.setPixelRatio(this.settings.dpr);
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.setClearColor(CONFIG.palette.deepBlack, 1);

          this.scene = new THREE.Scene();
          this.scene.fog = new THREE.FogExp2(CONFIG.palette.deepBlack, 0.022);

          this.camera = new THREE.PerspectiveCamera(this.getResponsiveFOV(), window.innerWidth / window.innerHeight, 0.1, 180);
          this.camera.position.set(0, 0, 18);

          this.glowTex = createGlowTexture('#FFF5E4', '#DFA5C8', 'rgba(89,64,131,0)');
          this.blueGlowTex = createGlowTexture('#FFFFFF', '#9BBEEA', 'rgba(23,16,43,0)');
          this.violetGlowTex = createGlowTexture('#FFFFFF', '#A18BEA', 'rgba(23,16,43,0)');

          this.starGroup = new THREE.Group();
          this.nebulaGroup = new THREE.Group();
          this.chapter1Group = new THREE.Group();
          this.chapter2Group = new THREE.Group();
          this.chapter3Group = new THREE.Group();
          this.portalGroup = new THREE.Group();
          this.fxGroup = new THREE.Group();

          this.scene.add(this.nebulaGroup, this.starGroup, this.chapter1Group, this.chapter2Group, this.chapter3Group, this.portalGroup, this.fxGroup);
        }

        getResponsiveFOV() {
          const aspect = window.innerWidth / window.innerHeight;
          if (aspect < 0.6) return 62;
          if (aspect < 0.8) return 56;
          return 48;
        }

        getResponsiveSceneScale() {
          const aspect = window.innerWidth / window.innerHeight;
          if (aspect < 0.55) return 0.78;
          if (aspect < 0.75) return 0.88;
          if (aspect > 1.3) return 0.94;
          return 1.0;
        }

        initSharedEnvironment() {
          const count = this.settings.starCount;
          const positions = new Float32Array(count * 3);
          const colors = new Float32Array(count * 3);

          const starPalette = [
            new THREE.Color(CONFIG.palette.pearlWhite),
            new THREE.Color(CONFIG.palette.warmLight),
            new THREE.Color(CONFIG.palette.moonlightBlue),
            new THREE.Color(CONFIG.palette.dreamLavender),
            new THREE.Color(CONFIG.palette.softRose)
          ];

          for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            const radius = 14 + Math.random() * 68;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i3 + 2] = -10 + (Math.random() - 0.5) * 95;

            const c = starPalette[i % starPalette.length];
            colors[i3] = c.r;
            colors[i3 + 1] = c.g;
            colors[i3 + 2] = c.b;
          }

          const starGeo = new THREE.BufferGeometry();
          starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

          this.starMat = new THREE.PointsMaterial({
            size: 0.25,
            map: this.glowTex,
            vertexColors: true,
            transparent: true,
            opacity: 0.0,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          });

          this.starField = new THREE.Points(starGeo, this.starMat);
          this.starGroup.add(this.starField);

          const dustCount = this.settings.dustParticles;
          const dustPos = new Float32Array(dustCount * 3);
          for (let i = 0; i < dustCount; i++) {
            dustPos[i * 3] = (Math.random() - 0.5) * 26;
            dustPos[i * 3 + 1] = (Math.random() - 0.5) * 26;
            dustPos[i * 3 + 2] = (Math.random() - 0.5) * 24;
          }
          const dustGeo = new THREE.BufferGeometry();
          dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
          this.dustMat = new THREE.PointsMaterial({
            size: 0.15,
            map: this.violetGlowTex,
            color: CONFIG.palette.dreamLavender,
            transparent: true,
            opacity: 0.0,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          });
          this.dustField = new THREE.Points(dustGeo, this.dustMat);
          this.starGroup.add(this.dustField);

          this.nebulaSprites = [];
          const nebulaConfigs = [
            { pos: [-5, 3, -24], scale: 28, tex: this.violetGlowTex, opacity: 0.22 },
            { pos: [6, -4, -28], scale: 32, tex: this.glowTex, opacity: 0.18 },
            { pos: [0, 0, -34], scale: 38, tex: this.blueGlowTex, opacity: 0.16 }
          ];

          nebulaConfigs.forEach((cfg) => {
            const mat = new THREE.SpriteMaterial({
              map: cfg.tex,
              transparent: true,
              opacity: 0.0,
              depthWrite: false,
              blending: THREE.AdditiveBlending
            });
            const sprite = new THREE.Sprite(mat);
            sprite.position.set(...cfg.pos);
            sprite.scale.set(cfg.scale, cfg.scale, 1);
            sprite.userData.targetOpacity = cfg.opacity;
            this.nebulaGroup.add(sprite);
            this.nebulaSprites.push(sprite);
          });

          const breathMat = new THREE.SpriteMaterial({
            map: this.glowTex,
            color: CONFIG.palette.warmLight,
            transparent: true,
            opacity: 0.0,
            blending: THREE.AdditiveBlending
          });
          this.firstBreathLight = new THREE.Sprite(breathMat);
          this.firstBreathLight.position.set(0, 0.3, 0);
          this.firstBreathLight.scale.set(0.4, 0.4, 1);
          this.fxGroup.add(this.firstBreathLight);
        }

        showStoryText(text, { isClimax = false } = {}) {
          if (this.textTimer) {
            clearTimeout(this.textTimer);
            this.textTimer = null;
          }
          const el = this.dom.storyLine;
          el.classList.remove('active', 'love-climax');
          el.classList.add('exiting');

          this.textTimer = setTimeout(() => {
            el.classList.remove('exiting');
            el.innerHTML = text.replace(/\n/g, '<br>');
            if (isClimax) el.classList.add('love-climax');
            void el.offsetWidth;
            el.classList.add('active');
            this.textTimer = null;
          }, 240);
        }

        hideStoryText() {
          if (this.textTimer) {
            clearTimeout(this.textTimer);
            this.textTimer = null;
          }
          const el = this.dom.storyLine;
          if (!el.classList.contains('active')) return;
          el.classList.remove('active');
          el.classList.add('exiting');
        }

        setChapterHeader(label, title) {
          this.dom.chapterLabel.textContent = label;
          this.dom.chapterTitle.textContent = title;
          this.dom.chapterHeader.classList.add('visible');
        }

        hideChapterHeader() {
          this.dom.chapterHeader.classList.remove('visible');
        }

        updateChapterDots(activeChapter) {
          this.dom.chapterDots.forEach((dot) => {
            const ch = Number(dot.dataset.chapter);
            dot.classList.remove('active', 'completed');
            if (ch === activeChapter) dot.classList.add('active');
            else if (ch < activeChapter) dot.classList.add('completed');
          });
        }

        showPrimaryButton(label, onClick) {
          const btn = this.dom.primaryBtn;
          btn.textContent = label;
          btn.classList.remove('pressed');
          btn.onclick = null;

          let locked = false;
          btn.onclick = (e) => {
            if (locked || this.state.isTransitioning) return;
            locked = true;
            this.spawnButtonRipple(btn, e);
            btn.classList.add('pressed');

            this.anim.schedule(() => {
              btn.classList.remove('visible');
              onClick();
            }, 450);
          };

          btn.classList.add('visible');
        }

        hidePrimaryButton() {
          this.dom.primaryBtn.classList.remove('visible', 'pressed');
          this.dom.primaryBtn.onclick = null;
        }

        spawnButtonRipple(btn, event) {
          const rect = btn.getBoundingClientRect();
          const x = (event && event.clientX ? event.clientX - rect.left : rect.width / 2);
          const y = (event && event.clientY ? event.clientY - rect.top : rect.height / 2);
          const ripple = document.createElement('span');
          ripple.className = 'btn-ripple';
          ripple.style.left = `${x}px`;
          ripple.style.top = `${y}px`;
          ripple.style.width = `${Math.max(rect.width, rect.height)}px`;
          ripple.style.height = `${Math.max(rect.width, rect.height)}px`;
          btn.appendChild(ripple);
          setTimeout(() => ripple.remove(), 900);
        }

        startIntroSequence() {
          this.anim.clearAll();
          this.state.chapter = 0;
          this.state.isTransitioning = false;

          this.dom.topHud.classList.remove('visible');
          this.hideChapterHeader();
          this.hideStoryText();
          this.hidePrimaryButton();
          this.dom.replayBtn.classList.remove('visible');
          this.dom.memProgressBar.classList.remove('visible');
          this.dom.gestureHint.classList.remove('visible');

          this.camera.position.set(0, 0, 18);
          this.camera.lookAt(0, 0, 0);
          this.firstBreathLight.visible = true;
          this.firstBreathLight.material.opacity = 0;
          this.firstBreathLight.scale.set(0.3, 0.3, 1);

          this.anim.tween({
            from: 0,
            to: 0.95,
            duration: 1.8,
            ease: 'easeOutCubic',
            onUpdate: (v) => {
              this.firstBreathLight.material.opacity = v;
              const s = 0.3 + v * 1.4;
              this.firstBreathLight.scale.set(s, s, 1);
            }
          });

          this.anim.schedule(() => {
            this.anim.tween({
              from: 0,
              to: 0.85,
              duration: 2.4,
              ease: 'easeInOutQuint',
              onUpdate: (v) => {
                this.starMat.opacity = v;
                this.dustMat.opacity = v * 0.45;
              }
            });
          }, 1000);

          this.anim.schedule(() => {
            this.nebulaSprites.forEach((sp) => {
              this.anim.tween({
                from: 0,
                to: sp.userData.targetOpacity,
                duration: 2.6,
                ease: 'easeInOutQuint',
                onUpdate: (v) => { sp.material.opacity = v; }
              });
            });
          }, 2400);

          this.anim.schedule(() => {
            this.showStoryText('في مكان ما، بين كل هذه النجوم...');
          }, 3800);

          this.anim.schedule(() => {
            this.hideStoryText();
          }, 5800);

          this.anim.schedule(() => {
            this.showStoryText('هناك شيء أردت أن أصنعه لك.');
          }, 7000);

          this.anim.schedule(() => {
            this.dom.topHud.classList.add('visible');
            this.updateChapterDots(1);
            this.showPrimaryButton('ابدئي الرحلة', () => {
              this.transitionToChapter1();
            });
          }, 9000);
        }

        buildChapter1() {
          this.clearGroup(this.chapter1Group);
          const scale = this.getResponsiveSceneScale();
          const count = this.settings.heartParticles;

          const positions = new Float32Array(count * 3);
          const starOrigins = new Float32Array(count * 3);
          const orbitTargets = new Float32Array(count * 3);
          const heartTargets = new Float32Array(count * 3);
          const colors = new Float32Array(count * 3);

          const c1 = new THREE.Color(CONFIG.palette.warmLight);
          const c2 = new THREE.Color(CONFIG.palette.softRose);
          const c3 = new THREE.Color(CONFIG.palette.dreamLavender);

          for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            const r0 = Math.pow(Math.random(), 2) * 0.55;
            const theta0 = Math.random() * Math.PI * 2;
            const phi0 = Math.acos(2 * Math.random() - 1);
            starOrigins[i3] = r0 * Math.sin(phi0) * Math.cos(theta0);
            starOrigins[i3 + 1] = r0 * Math.sin(phi0) * Math.sin(theta0) + 0.55;
            starOrigins[i3 + 2] = r0 * Math.cos(phi0);

            positions[i3] = starOrigins[i3];
            positions[i3 + 1] = starOrigins[i3 + 1];
            positions[i3 + 2] = starOrigins[i3 + 2];

            const angle = Math.random() * Math.PI * 2;
            const rad = 1.3 + Math.random() * 2.55;
            orbitTargets[i3] = Math.cos(angle) * rad * scale;
            orbitTargets[i3 + 1] = (Math.random() - 0.5) * 1.45 + 0.55;
            orbitTargets[i3 + 2] = Math.sin(angle) * rad * scale;

            const hp = sampleHeartPoint(scale * 1.05, i % 4 !== 0);
            heartTargets[i3] = hp.x;
            heartTargets[i3 + 1] = hp.y + 0.55;
            heartTargets[i3 + 2] = hp.z;

            const mixCol = i % 3 === 0 ? c1 : (i % 3 === 1 ? c2 : c3);
            colors[i3] = mixCol.r;
            colors[i3 + 1] = mixCol.g;
            colors[i3 + 2] = mixCol.b;
          }

          const geo = new THREE.BufferGeometry();
          geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

          this.ch1Mat = new THREE.PointsMaterial({
            size: 0.17,
            map: this.glowTex,
            vertexColors: true,
            transparent: true,
            opacity: 0.0,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          });

          this.ch1Particles = new THREE.Points(geo, this.ch1Mat);
          this.ch1Data = { starOrigins, orbitTargets, heartTargets, morphFactor: 0, heartBeating: false };

          const coreMat = new THREE.SpriteMaterial({
            map: this.glowTex,
            color: CONFIG.palette.warmLight,
            transparent: true,
            opacity: 0.0,
            blending: THREE.AdditiveBlending
          });
          this.ch1CoreSprite = new THREE.Sprite(coreMat);
          this.ch1CoreSprite.position.set(0, 0.55, -0.2);
          this.ch1CoreSprite.scale.set(2.6, 2.6, 1);

          const haloMat = new THREE.SpriteMaterial({
            map: this.violetGlowTex,
            color: CONFIG.palette.softRose,
            transparent: true,
            opacity: 0.0,
            blending: THREE.AdditiveBlending
          });
          this.ch1HaloSprite = new THREE.Sprite(haloMat);
          this.ch1HaloSprite.position.set(0, 0.55, -0.5);
          this.ch1HaloSprite.scale.set(5.2 * scale, 5.2 * scale, 1);

          this.chapter1Group.add(this.ch1HaloSprite, this.ch1CoreSprite, this.ch1Particles);
        }

        transitionToChapter1() {
          this.state.isTransitioning = true;
          this.state.chapter = 1;
          this.updateChapterDots(1);
          this.hideStoryText();

          this.buildChapter1();

          this.anim.tween({
            from: 18,
            to: 11.4,
            duration: 2.6,
            ease: 'easeInOutQuint',
            onUpdate: (z) => { this.camera.position.z = z; }
          });

          this.anim.tween({
            from: this.firstBreathLight.material.opacity,
            to: 0,
            duration: 1.4,
            onUpdate: (v) => { this.firstBreathLight.material.opacity = v; },
            onComplete: () => { this.firstBreathLight.visible = false; }
          });

          this.anim.schedule(() => {
            this.state.isTransitioning = false;
            this.setChapterHeader('الفصل الأول', 'رسالة من بين النجوم');

            this.anim.tween({
              from: 0,
              to: 0.98,
              duration: 1.7,
              ease: 'easeOutCubic',
              onUpdate: (v) => {
                this.ch1Mat.opacity = v;
                this.ch1CoreSprite.material.opacity = v * 0.85;
                this.ch1HaloSprite.material.opacity = v * 0.35;
              }
            });

            this.showStoryText('من بين مليارات النجوم...');

            this.anim.schedule(() => {
              this.hideStoryText();
            }, 2600);

            this.anim.schedule(() => {
              this.showStoryText('هناك نجمة واحدة\nلفتت انتباهي أكثر من الجميع.');
              this.spawnShootingStar();
            }, 3500);

            this.anim.schedule(() => {
              this.hideStoryText();
              this.anim.tween({
                from: 0,
                to: 1,
                duration: 2.2,
                ease: 'easeInOutQuint',
                onUpdate: (v) => {
                  this.ch1Data.morphFactor = v;
                  this.ch1CoreSprite.scale.set(2.6 + v * 2.0, 2.6 + v * 2.0, 1);
                }
              });
            }, 6400);

            this.anim.schedule(() => {
              this.anim.tween({
                from: 1,
                to: 2,
                duration: 2.5,
                ease: 'easeOutQuart',
                onUpdate: (v) => {
                  this.ch1Data.morphFactor = v;
                  this.ch1CoreSprite.material.opacity = Math.max(0.28, 0.85 - (v - 1) * 0.55);
                  this.ch1HaloSprite.material.opacity = 0.35 + (v - 1) * 0.25;
                },
                onComplete: () => {
                  this.ch1Data.heartBeating = true;
                }
              });
            }, 8500);

            this.anim.schedule(() => {
              this.showStoryText('في عالم واسع إلى هذا الحد،\nبعض الأشياء تبدو\nوكأنها وجدت مكانها الصحيح.');
            }, 11100);

            this.anim.schedule(() => {
              this.hideStoryText();
            }, 14500);

            this.anim.schedule(() => {
              this.showStoryText('وأحيانًا،\nيكون وجود شخص واحد\nكافيًا ليجعل الأشياء\nأكثر جمالًا.');
            }, 15500);

            this.anim.schedule(() => {
              this.showPrimaryButton('لنكتشف ما وراء النجوم', () => {
                this.transitionToChapter2();
              });
            }, 18200);
          }, 1100);
        }

        buildChapter2() {
          this.clearGroup(this.chapter2Group);
          this.dom.memHotspots.innerHTML = '';
          this.ch2Objects = [];
          this.ch2HitMeshes = [];
          this.state.openedMemories.clear();
          this.state.activeMemoryId = null;
          this.state.allMemoriesConverged = false;

          this.dom.memNodes.forEach((n) => n.classList.remove('unlocked', 'converged'));

          const isLandscape = window.innerWidth > window.innerHeight;
          const layout = isLandscape
            ? [
                { x: -4.2, y: 1.2, z: 0 },
                { x: -2.1, y: -1.1, z: 0.6 },
                { x: 0.0, y: 1.4, z: -0.4 },
                { x: 2.1, y: -1.1, z: 0.6 },
                { x: 4.2, y: 1.2, z: 0 }
              ]
            : [
                { x: -1.85, y: 2.35, z: 0.2 },
                { x: 1.85, y: 2.15, z: -0.2 },
                { x: 0.0, y: 0.35, z: 0.7 },
                { x: -1.75, y: -1.65, z: 0.1 },
                { x: 1.75, y: -1.85, z: -0.1 }
              ];

          CONFIG.memories.forEach((mem, idx) => {
            const group = new THREE.Group();
            const home = new THREE.Vector3(layout[idx].x, layout[idx].y, layout[idx].z);
            group.position.copy(home);
            group.scale.set(0.001, 0.001, 0.001);

            const hitMesh = new THREE.Mesh(
              new THREE.SphereGeometry(1.05, 16, 16),
              new THREE.MeshBasicMaterial({ visible: false })
            );
            hitMesh.userData.memoryId = idx;
            group.add(hitMesh);
            this.ch2HitMeshes.push(hitMesh);

            if (idx === 0) {
              const shell = new THREE.Mesh(
                new THREE.SphereGeometry(0.68, 28, 28),
                new THREE.MeshBasicMaterial({ color: 0xFFF5E4, transparent: true, opacity: 0.24 })
              );
              const rim = new THREE.Mesh(
                new THREE.RingGeometry(0.69, 0.73, 48),
                new THREE.MeshBasicMaterial({ color: 0xFFF5E4, side: THREE.DoubleSide, transparent: true, opacity: 0.6 })
              );
              const core = new THREE.Sprite(new THREE.SpriteMaterial({
                map: this.glowTex, color: 0xFFF5E4, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending
              }));
              core.scale.set(1.5, 1.5, 1);
              group.add(shell, rim, core);
            } else if (idx === 1) {
              for (let r = 0; r < 3; r++) {
                const torus = new THREE.Mesh(
                  new THREE.TorusGeometry(0.45 + r * 0.15, 0.02, 12, 48),
                  new THREE.MeshBasicMaterial({ color: 0xDFA5C8, transparent: true, opacity: 0.78 - r * 0.16 })
                );
                torus.rotation.x = r * 0.65;
                torus.rotation.y = r * 0.5;
                group.add(torus);
              }
              const spark = new THREE.Sprite(new THREE.SpriteMaterial({
                map: this.glowTex, color: 0xDFA5C8, transparent: true, opacity: 0.88, blending: THREE.AdditiveBlending
              }));
              spark.scale.set(1.25, 1.25, 1);
              group.add(spark);
            } else if (idx === 2) {
              const pCount = this.settings.orbParticles;
              const pPos = new Float32Array(pCount * 3);
              for (let p = 0; p < pCount; p++) {
                const angle = (p / pCount) * Math.PI * 2 * 5;
                const petal = Math.sin(angle * 2.5) * 0.45 + 0.35;
                pPos[p * 3] = Math.cos(angle) * petal;
                pPos[p * 3 + 1] = Math.sin(angle) * petal;
                pPos[p * 3 + 2] = Math.cos(angle * 3) * 0.25;
              }
              const pGeo = new THREE.BufferGeometry();
              pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
              const flower = new THREE.Points(pGeo, new THREE.PointsMaterial({
                size: 0.15, map: this.violetGlowTex, color: 0xA18BEA, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false
              }));
              const centerGlow = new THREE.Sprite(new THREE.SpriteMaterial({
                map: this.violetGlowTex, color: 0xFFFFFF, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending
              }));
              centerGlow.scale.set(1.15, 1.15, 1);
              group.add(flower, centerGlow);
            } else if (idx === 3) {
              const moon = new THREE.Mesh(
                new THREE.SphereGeometry(0.46, 24, 24),
                new THREE.MeshBasicMaterial({ color: 0x9BBEEA, transparent: true, opacity: 0.75 })
              );
              const orbit = new THREE.Mesh(
                new THREE.TorusGeometry(0.78, 0.016, 10, 48),
                new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.58 })
              );
              orbit.rotation.x = 1.15;
              orbit.rotation.y = 0.35;
              const halo = new THREE.Sprite(new THREE.SpriteMaterial({
                map: this.blueGlowTex, color: 0x9BBEEA, transparent: true, opacity: 0.88, blending: THREE.AdditiveBlending
              }));
              halo.scale.set(1.45, 1.45, 1);
              group.add(moon, orbit, halo);
            } else {
              const crystal = new THREE.Mesh(
                new THREE.OctahedronGeometry(0.62, 0),
                new THREE.MeshBasicMaterial({ color: 0xD5A88D, wireframe: true, transparent: true, opacity: 0.7 })
              );
              const innerCrystal = new THREE.Mesh(
                new THREE.OctahedronGeometry(0.36, 0),
                new THREE.MeshBasicMaterial({ color: 0xFFF5E4, transparent: true, opacity: 0.48 })
              );
              const core = new THREE.Sprite(new THREE.SpriteMaterial({
                map: this.glowTex, color: 0xD5A88D, transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending
              }));
              core.scale.set(1.35, 1.35, 1);
              group.add(crystal, innerCrystal, core);
            }

            group.userData = { id: idx, home, phase: idx * 1.3, opened: false };
            this.chapter2Group.add(group);
            this.ch2Objects.push(group);

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'memory-hotspot';
            btn.setAttribute('aria-label', `${mem.code} — ${mem.title}`);
            btn.innerHTML = `<span class="memory-hotspot-label">${mem.title}</span>`;
            const handleSelect = (ev) => {
              ev.stopPropagation();
              if (this.state.chapter !== 2 || this.state.activeMemoryId !== null) return;
              this.openMemory(idx);
            };
            btn.addEventListener('click', handleSelect);
            this.dom.memHotspots.appendChild(btn);
            group.userData.hotspot = btn;
          });
        }

        transitionToChapter2() {
          this.state.isTransitioning = true;
          this.state.chapter = 2;
          this.updateChapterDots(2);
          this.hideStoryText();

          this.ch1Data.heartBeating = false;
          this.anim.tween({
            from: 2,
            to: 1,
            duration: 1.6,
            ease: 'easeInOutQuint',
            onUpdate: (v) => {
              this.ch1Data.morphFactor = v;
              this.ch1Mat.opacity = Math.max(0, (v - 1) * 0.9);
              this.ch1CoreSprite.material.opacity = Math.max(0, (v - 1) * 0.5);
              this.ch1HaloSprite.material.opacity = Math.max(0, (v - 1) * 0.3);
            },
            onComplete: () => {
              this.clearGroup(this.chapter1Group);
            }
          });

          this.nebulaSprites.forEach((sp, i) => {
            sp.material.color.setHex(i % 2 === 0 ? CONFIG.palette.softRose : CONFIG.palette.dreamLavender);
          });

          this.anim.schedule(() => {
            this.buildChapter2();
            this.setChapterHeader('الفصل الثاني', 'تفاصيل صغيرة، ومشاعر كبيرة');
            this.dom.memProgressBar.classList.add('visible');
            this.dom.gestureHint.textContent = 'المسي كل عنصر لتكتشفي ما بداخله';
            this.dom.gestureHint.classList.add('visible');

            this.ch2Objects.forEach((obj, idx) => {
              this.anim.schedule(() => {
                this.anim.tween({
                  from: 0.001,
                  to: 1,
                  duration: 1.1,
                  ease: 'easeOutQuart',
                  onUpdate: (s) => { obj.scale.set(s, s, s); },
                  onComplete: () => {
                    if (obj.userData.hotspot) obj.userData.hotspot.classList.add('active');
                  }
                });
              }, idx * 170);
            });

            this.state.isTransitioning = false;
          }, 1250);
        }

        openMemory(id) {
          if (this.state.activeMemoryId !== null) return;
          this.state.activeMemoryId = id;
          const mem = CONFIG.memories[id];
          const targetObj = this.ch2Objects[id];
          if (!mem || !targetObj) return;

          this.ch2Objects.forEach((o) => {
            if (o.userData.hotspot) o.userData.hotspot.classList.remove('active');
          });
          this.dom.gestureHint.classList.remove('visible');
          this.dom.canvas.classList.add('is-blurred');

          this.anim.tween({
            from: 0,
            to: 1,
            duration: 0.9,
            ease: 'easeOutQuart',
            onUpdate: (p) => {
              targetObj.position.lerpVectors(targetObj.userData.home, new THREE.Vector3(0, 1.35, 4.2), p);
              const s = 1 + p * 0.45;
              targetObj.scale.set(s, s, s);
            }
          });

          if (!this.state.openedMemories.has(id)) {
            this.state.openedMemories.add(id);
            targetObj.userData.opened = true;
            if (targetObj.userData.hotspot) targetObj.userData.hotspot.classList.add('opened');
            const node = this.dom.memNodes[id];
            if (node) node.classList.add('unlocked');
          }

          this.dom.memReaderTitle.textContent = `${mem.code} — ${mem.title}`;
          this.dom.memReaderBody.innerHTML = mem.text.replace(/\n/g, '<br>');
          this.dom.memReader.setAttribute('aria-hidden', 'false');
          this.dom.memReader.classList.add('open');
        }

        closeMemory() {
          const id = this.state.activeMemoryId;
          if (id === null) return;
          const targetObj = this.ch2Objects[id];

          this.dom.memReader.classList.remove('open');
          this.dom.memReader.setAttribute('aria-hidden', 'true');
          this.dom.canvas.classList.remove('is-blurred');

          const startPos = targetObj.position.clone();
          this.anim.tween({
            from: 0,
            to: 1,
            duration: 0.85,
            ease: 'easeInOutQuint',
            onUpdate: (p) => {
              targetObj.position.lerpVectors(startPos, targetObj.userData.home, p);
              const s = 1.45 - p * 0.45;
              targetObj.scale.set(s, s, s);
            },
            onComplete: () => {
              this.state.activeMemoryId = null;
              if (this.state.openedMemories.size >= CONFIG.memories.length && !this.state.allMemoriesConverged) {
                this.triggerAllMemoriesComplete();
              } else {
                this.ch2Objects.forEach((o) => {
                  if (o.userData.hotspot) o.userData.hotspot.classList.add('active');
                });
              }
            }
          });
        }

        triggerAllMemoriesComplete() {
          this.state.allMemoriesConverged = true;
          this.dom.memNodes.forEach((n) => n.classList.add('converged'));

          const radius = 2.1 * this.getResponsiveSceneScale();
          this.ch2Objects.forEach((obj, idx) => {
            const angle = (idx / 5) * Math.PI * 2 - Math.PI / 2;
            const targetPos = new THREE.Vector3(Math.cos(angle) * radius, Math.sin(angle) * radius + 0.5, 0.8);
            const startPos = obj.position.clone();
            this.anim.tween({
              from: 0,
              to: 1,
              duration: 1.7,
              ease: 'easeInOutQuint',
              onUpdate: (p) => { obj.position.lerpVectors(startPos, targetPos, p); }
            });
          });

          this.anim.schedule(() => {
            this.showStoryText('بقي شيء واحد...');
          }, 900);

          this.anim.schedule(() => {
            this.hideStoryText();
          }, 3200);

          this.anim.schedule(() => {
            this.showStoryText('شيء لم أستطع وضعه\nداخل ذكرى.');
          }, 4200);

          this.anim.schedule(() => {
            this.showPrimaryButton('اكتشاف الأخير', () => {
              this.transitionToChapter3();
            });
          }, 6800);
        }

        transitionToChapter3() {
          this.state.isTransitioning = true;
          this.state.chapter = 3;
          this.updateChapterDots(3);
          this.hideStoryText();
          this.dom.memProgressBar.classList.remove('visible');

          this.clearGroup(this.portalGroup);
          const portalRings = [];
          for (let i = 0; i < 6; i++) {
            const ring = new THREE.Mesh(
              new THREE.TorusGeometry(1.4 + i * 0.45, 0.025, 12, 64),
              new THREE.MeshBasicMaterial({
                color: i % 2 === 0 ? CONFIG.palette.warmLight : CONFIG.palette.dreamLavender,
                transparent: true,
                opacity: 0.0
              })
            );
            ring.position.z = -i * 1.4;
            this.portalGroup.add(ring);
            portalRings.push(ring);
          }

          this.anim.tween({
            from: 0,
            to: 1,
            duration: 1.5,
            ease: 'easeInOutQuint',
            onUpdate: (p) => {
              portalRings.forEach((r, idx) => {
                r.material.opacity = p * (0.75 - idx * 0.08);
                r.rotation.z = p * (idx % 2 === 0 ? 1.8 : -1.8);
              });
              this.ch2Objects.forEach((o) => {
                const s = Math.max(0.001, 1 - p);
                o.scale.set(s, s, s);
              });
            }
          });

          this.anim.schedule(() => {
            this.anim.tween({
              from: this.camera.position.z,
              to: -6,
              duration: 1.9,
              ease: 'easeInCubic',
              onUpdate: (z) => {
                this.camera.position.z = z;
                portalRings.forEach((r, idx) => { r.rotation.z += 0.025 * (idx % 2 === 0 ? 1 : -1); });
              },
              onComplete: () => {
                this.clearGroup(this.chapter2Group);
                this.clearGroup(this.portalGroup);
                this.camera.position.set(0, 0, 12.8);
                this.enterChapter3();
              }
            });
          }, 1200);
        }

        buildChapter3() {
          this.clearGroup(this.chapter3Group);
          const scale = this.getResponsiveSceneScale();
          const count = this.settings.heartParticles;

          const positions = new Float32Array(count * 3);
          const scatterOrigins = new Float32Array(count * 3);
          const heartBase = new Float32Array(count * 3);
          const phases = new Float32Array(count);
          const drawOrder = new Float32Array(count);
          const colors = new Float32Array(count * 3);

          const colCore = new THREE.Color(CONFIG.palette.warmLight);
          const colMid = new THREE.Color(CONFIG.palette.softRose);
          const colOuter = new THREE.Color(CONFIG.palette.dreamLavender);

          for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            const isShell = i % 5 !== 0;
            const hp = sampleHeartPoint(scale * 1.55, isShell);

            heartBase[i3] = hp.x;
            heartBase[i3 + 1] = hp.y + 0.65;
            heartBase[i3 + 2] = hp.z;

            const ang = Math.random() * Math.PI * 2;
            const rad = 4.2 + Math.random() * 5.2;
            scatterOrigins[i3] = Math.cos(ang) * rad * scale;
            scatterOrigins[i3 + 1] = (Math.random() - 0.5) * 6.5 + 0.65;
            scatterOrigins[i3 + 2] = Math.sin(ang) * rad * scale;

            positions[i3] = scatterOrigins[i3];
            positions[i3 + 1] = scatterOrigins[i3 + 1];
            positions[i3 + 2] = scatterOrigins[i3 + 2];

            const angleAroundHeart = (Math.atan2(hp.y + 0.65 - 0.65, hp.x) + Math.PI) / (Math.PI * 2);
            drawOrder[i] = angleAroundHeart * 0.65 + Math.random() * 0.35;

            phases[i] = Math.random() * Math.PI * 2;

            const c = i % 3 === 0 ? colCore : (i % 3 === 1 ? colMid : colOuter);
            colors[i3] = c.r;
            colors[i3 + 1] = c.g;
            colors[i3 + 2] = c.b;
          }

          const heartGeo = new THREE.BufferGeometry();
          heartGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          heartGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

          this.ch3HeartMat = new THREE.PointsMaterial({
            size: 0.16,
            map: this.glowTex,
            vertexColors: true,
            transparent: true,
            opacity: 0.0,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          });

          this.ch3HeartPoints = new THREE.Points(heartGeo, this.ch3HeartMat);

          this.ch3Aura = new THREE.Sprite(new THREE.SpriteMaterial({
            map: this.glowTex, color: CONFIG.palette.softRose, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending
          }));
          this.ch3Aura.position.set(0, 0.65, -0.6);
          this.ch3Aura.scale.set(0.4, 0.4, 1);

          const nameTex = createCrispNameTexture(CONFIG.recipientName);
          this.ch3NameSprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: nameTex,
            transparent: true,
            opacity: 0.0,
            depthWrite: false,
            blending: THREE.AdditiveBlending
          }));
          this.ch3NameSprite.position.set(0, 0.72, 0.45);
          this.ch3NameSprite.scale.set(2.8 * scale, 0.7 * scale, 1);

          this.ch3CrownStar = new THREE.Sprite(new THREE.SpriteMaterial({
            map: this.glowTex, color: CONFIG.palette.warmLight, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending
          }));
          this.ch3CrownStar.position.set(0, 2.35 * scale + 0.65, 0.2);
          this.ch3CrownStar.scale.set(0.3, 0.3, 1);

          this.ch3Orbits = [];
          const ringSpecs = [
            { radius: 3.35 * scale, tiltX: 1.18, tiltY: 0.24, speed: 0.28, color: CONFIG.palette.dreamLavender },
            { radius: 3.72 * scale, tiltX: -1.12, tiltY: -0.28, speed: -0.22, color: CONFIG.palette.softRose }
          ];

          ringSpecs.forEach((spec) => {
            const orbitGroup = new THREE.Group();
            orbitGroup.rotation.x = spec.tiltX;
            orbitGroup.rotation.y = spec.tiltY;
            orbitGroup.position.y = 0.65;
            orbitGroup.scale.set(0.15, 0.15, 0.15);

            const ringMesh = new THREE.Mesh(
              new THREE.TorusGeometry(spec.radius, 0.015, 10, 96),
              new THREE.MeshBasicMaterial({ color: spec.color, transparent: true, opacity: 0.0 })
            );
            ringMesh.rotation.x = Math.PI / 2;
            orbitGroup.add(ringMesh);
            orbitGroup.userData = { speed: spec.speed, mesh: ringMesh, radius: spec.radius };

            this.chapter3Group.add(orbitGroup);
            this.ch3Orbits.push(orbitGroup);
          });

          const wordCount = this.settings.orbitalWordCount;
          this.ch3WordSprites = [];
          for (let i = 0; i < wordCount; i++) {
            const word = CONFIG.orbitalLoveWords[i % CONFIG.orbitalLoveWords.length];
            const tex = createOrbitalWordTexture(word);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
              map: tex, transparent: true, opacity: 0.0, depthWrite: false
            }));
            const parentOrbit = this.ch3Orbits[i % this.ch3Orbits.length];
            const angle = (i / wordCount) * Math.PI * 2;
            const r = parentOrbit.userData.radius;
            sprite.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
            sprite.scale.set(2.0 * scale, 0.5 * scale, 1);
            parentOrbit.add(sprite);
            this.ch3WordSprites.push(sprite);
          }

          this.ch3Data = {
            scatterOrigins,
            heartBase,
            phases,
            drawOrder,
            assembleProgress: 0,
            nameRevealed: false,
            orbitSpeedMult: 1
          };

          this.chapter3Group.add(this.ch3HeartPoints, this.ch3Aura, this.ch3NameSprite, this.ch3CrownStar);
        }

        enterChapter3() {
          this.buildChapter3();
          this.state.isTransitioning = false;
          this.state.chapter3Phase = 'narrative';
          this.setChapterHeader('الفصل الثالث', 'عالم صُنع من أجلك');

          this.nebulaSprites.forEach((sp, i) => {
            sp.material.color.setHex(i === 0 ? CONFIG.palette.nebulaViolet : (i === 1 ? CONFIG.palette.softRose : CONFIG.palette.dreamLavender));
          });

          const sc = this.getResponsiveSceneScale();

          this.anim.tween({
            from: 0,
            to: 1,
            duration: 3.4,
            ease: 'easeInOutQuint',
            onUpdate: (v) => {
              this.ch3Data.assembleProgress = v;
              this.ch3HeartMat.opacity = Math.min(0.95, v * 1.15);
              const auraS = (0.5 + v * 5.1) * sc;
              this.ch3Aura.scale.set(auraS, auraS, 1);
              this.ch3Aura.material.opacity = v * 0.38;

              const ringScale = 0.2 + v * 0.8;
              this.ch3Orbits.forEach((o) => {
                o.scale.set(ringScale, ringScale, ringScale);
                o.userData.mesh.material.opacity = v * 0.42;
              });
              this.ch3WordSprites.forEach((s) => { s.material.opacity = v * 0.78; });
            }
          });

          this.anim.schedule(() => { this.showStoryText('لو كان للحب مكان...'); }, 3200);
          this.anim.schedule(() => { this.hideStoryText(); }, 5900);
          this.anim.schedule(() => { this.showStoryText('لربما وجدته\nفي الأشياء التي تشبهك.'); }, 6900);
          this.anim.schedule(() => { this.hideStoryText(); }, 9900);

          this.anim.schedule(() => {
            this.showStoryText('وفي كل مرة حاولت فيها\nأن أصف شعورًا جميلًا...');
            this.anim.tween({ from: 1, to: 0.55, duration: 2.2, ease: 'easeInOutCubic', onUpdate: (v) => { this.ch3Data.orbitSpeedMult = v; } });
          }, 10900);

          this.anim.schedule(() => { this.hideStoryText(); }, 14200);
          this.anim.schedule(() => { this.showStoryText('وجدت أن الكلمات\nأصغر من الشعور.'); }, 15200);
          this.anim.schedule(() => { this.hideStoryText(); }, 18400);

          this.anim.schedule(() => {
            this.triggerParticleReleaseAndName();
          }, 19400);
        }

        triggerParticleReleaseAndName() {
          this.state.chapter3Phase = 'releasing';

          this.anim.tween({ from: this.ch3Data.orbitSpeedMult, to: 0.45, duration: 1.8, ease: 'easeInOutCubic', onUpdate: (v) => { this.ch3Data.orbitSpeedMult = v; } });

          this.showStoryText('هناك شيء\nأردت أن أهديه لك...');
          this.anim.schedule(() => { this.hideStoryText(); }, 2700);

          this.anim.schedule(() => {
            this.ch3Data.nameRevealed = true;
            this.state.chapter3Phase = 'nameRevealed';
            const sc = this.getResponsiveSceneScale();

            this.anim.tween({
              from: 0,
              to: 1,
              duration: 2.0,
              ease: 'easeOutQuart',
              onUpdate: (v) => {
                this.ch3NameSprite.material.opacity = v;
                const ns = 0.78 + v * 0.22;
                this.ch3NameSprite.scale.set(3.45 * sc * ns, 0.86 * sc * ns, 1);
                this.ch3CrownStar.material.opacity = v * 0.95;
                const cs = 0.3 + v * 0.85;
                this.ch3CrownStar.scale.set(cs, cs, 1);
                this.ch3Aura.material.opacity = 0.38 + v * 0.2;
              }
            });
          }, 3400);

          const finalMessages = [
            'إلى الشخص\nالذي يجعل الأيام العادية\nأكثر جمالًا...',
            'لم أحتج إلى مناسبة\nلأصنع لك هذه الرحلة.',
            'أردت فقط أن أصنع شيئًا\nيكون مختلفًا عن الكلمات المعتادة.',
            'شيئًا صغيرًا،\nلكنه صُنع بكل اهتمام.',
            'وبين كل هذه النجوم،\nوكل هذه التفاصيل،\nوكل هذه العوالم...'
          ];

          let delay = 6200;
          finalMessages.forEach((msg) => {
            this.anim.schedule(() => { this.showStoryText(msg); }, delay);
            this.anim.schedule(() => { this.hideStoryText(); }, delay + 3000);
            delay += 4000;
          });

          this.anim.schedule(() => {
            this.heartbeatPhase = 0.01;
            this.showStoryText('أحبك.', { isClimax: true });
            this.state.chapter3Phase = 'eternal';

            this.anim.tween({ from: 0.45, to: 0.75, duration: 2.5, ease: 'easeInOutCubic', onUpdate: (v) => { this.ch3Data.orbitSpeedMult = v; } });
            this.anim.tween({
              from: 0.35,
              to: 0.72,
              duration: 2.5,
              ease: 'easeInOutCubic',
              onUpdate: (v) => {
                this.ch3WordSprites.forEach((s) => { s.material.opacity = v; });
                this.ch3Orbits.forEach((o) => { o.userData.mesh.material.opacity = v * 0.65; });
              }
            });
          }, delay + 500);

          this.anim.schedule(() => {
            this.dom.replayBtn.classList.add('visible');
          }, delay + 4400);
        }

        replayExperience() {
          if (this.state.isTransitioning) return;
          this.state.isTransitioning = true;

          this.dom.replayBtn.classList.remove('visible');
          this.dom.gestureHint.classList.remove('visible');
          this.hideStoryText();
          this.hideChapterHeader();

          this.anim.tween({
            from: 1,
            to: 0,
            duration: 1.7,
            ease: 'easeInOutQuint',
            onUpdate: (v) => {
              if (this.ch3HeartMat) this.ch3HeartMat.opacity = v * 0.95;
              if (this.ch3NameSprite) this.ch3NameSprite.material.opacity = v;
              if (this.ch3CrownStar) this.ch3CrownStar.material.opacity = v * 0.95;
              if (this.ch3Aura) this.ch3Aura.material.opacity = v * 0.45;
              if (this.ch3Orbits) this.ch3Orbits.forEach((o) => { o.userData.mesh.material.opacity = v * 0.4; });
              if (this.ch3WordSprites) this.ch3WordSprites.forEach((s) => { s.material.opacity = v * 0.7; });
            },
            onComplete: () => {
              this.clearGroup(this.chapter3Group);
              this.clearGroup(this.chapter2Group);
              this.clearGroup(this.chapter1Group);
              this.nebulaSprites.forEach((sp) => {
                sp.material.color.setHex(0xFFFFFF);
                sp.material.opacity = 0;
              });
              this.starMat.opacity = 0;
              this.dustMat.opacity = 0;
              this.startIntroSequence();
            }
          });
        }

        checkChapter2Raycast(clientX, clientY) {
          if (this.state.chapter !== 2 || this.state.activeMemoryId !== null || !this.ch2HitMeshes || !this.ch2HitMeshes.length) {
            return false;
          }
          const ndc = new THREE.Vector2(
            (clientX / window.innerWidth) * 2 - 1,
            -(clientY / window.innerHeight) * 2 + 1
          );
          this.raycaster.setFromCamera(ndc, this.camera);
          const hits = this.raycaster.intersectObjects(this.ch2HitMeshes, false);
          if (hits.length > 0 && typeof hits[0].object.userData.memoryId === 'number') {
            this.openMemory(hits[0].object.userData.memoryId);
            return true;
          }
          return false;
        }

        spawnTouchSpark(ndcX, ndcY) {
          const vec = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(this.camera);
          const dir = vec.sub(this.camera.position).normalize();
          const pos = this.camera.position.clone().add(dir.multiplyScalar(10));

          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: this.glowTex, color: CONFIG.palette.warmLight, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending
          }));
          sprite.position.copy(pos);
          sprite.scale.set(0.3, 0.3, 1);
          this.fxGroup.add(sprite);

          this.anim.tween({
            from: 0,
            to: 1,
            duration: 1.2,
            ease: 'easeOutQuart',
            onUpdate: (p) => {
              const s = 0.3 + p * 2.2;
              sprite.scale.set(s, s, 1);
              sprite.material.opacity = (1 - p) * 0.85;
              sprite.position.y += 0.01;
            },
            onComplete: () => {
              this.fxGroup.remove(sprite);
              sprite.material.dispose();
            }
          });
        }

        spawnShootingStar() {
          const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
            map: this.glowTex, color: CONFIG.palette.pearlWhite, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending
          }));
          const startX = (Math.random() - 0.3) * 18;
          const startY = 6 + Math.random() * 6;
          const z = -12 - Math.random() * 14;
          sprite.position.set(startX, startY, z);
          sprite.scale.set(1.5, 0.16, 1);
          sprite.material.rotation = -0.45;
          this.fxGroup.add(sprite);

          this.anim.tween({
            from: 0,
            to: 1,
            duration: 1.4,
            ease: 'easeInOutCubic',
            onUpdate: (p) => {
              sprite.position.x = startX - p * 14;
              sprite.position.y = startY - p * 6.8;
              sprite.material.opacity = Math.sin(p * Math.PI) * 0.85;
            },
            onComplete: () => {
              this.fxGroup.remove(sprite);
              sprite.material.dispose();
            }
          });
        }

        animate() {
          requestAnimationFrame(() => this.animate());

          const dt = Math.min(this.clock.getDelta(), 0.05);
          this.elapsed += dt;
          this.perf.recordFrame(dt);
          this.anim.update(dt);

          this.pointer.x += (this.pointer.targetX - this.pointer.x) * 0.05;
          this.pointer.y += (this.pointer.targetY - this.pointer.y) * 0.05;

          const camOffsetX = (this.pointer.x * 0.85) + (this.deviceTilt.x * 0.65) + Math.sin(this.elapsed * 0.25) * 0.24;
          const camOffsetY = (this.pointer.y * 0.65) + (this.deviceTilt.y * 0.5) + Math.cos(this.elapsed * 0.2) * 0.2;

          this.camera.position.x += (camOffsetX - this.camera.position.x) * 0.055;
          this.camera.position.y += (camOffsetY - this.camera.position.y) * 0.055;
          this.camera.lookAt(0, 0.25, 0);

          this.starField.rotation.y += dt * 0.012;
          this.starField.rotation.x += dt * 0.004;
          this.dustField.rotation.y -= dt * 0.018;

          this.nebulaSprites.forEach((sp, idx) => {
            sp.position.x += Math.sin(this.elapsed * 0.16 + idx) * 0.002;
            sp.position.y += Math.cos(this.elapsed * 0.14 + idx) * 0.002;
          });

          if (this.firstBreathLight && this.firstBreathLight.visible) {
            const pulse = 1 + Math.sin(this.elapsed * 2.2) * 0.14;
            this.firstBreathLight.scale.set(1.5 * pulse, 1.5 * pulse, 1);
          }

          if (this.state.chapter === 1 && this.ch1Particles && this.ch1Data) {
            const posAttr = this.ch1Particles.geometry.attributes.position;
            const arr = posAttr.array;
            const { starOrigins, orbitTargets, heartTargets, morphFactor, heartBeating } = this.ch1Data;
            const count = arr.length / 3;

            this.heartbeatPhase += dt * 2.25;
            const beat = heartBeating ? (1 + Math.pow(Math.max(0, Math.sin(this.heartbeatPhase)), 6) * 0.095) : 1;

            if (this.ch1HaloSprite && this.ch1HaloSprite.material.opacity > 0.01) {
              const haloPulse = 1 + Math.sin(this.elapsed * 2.2) * 0.08;
              const sc = this.getResponsiveSceneScale() * 5.2 * haloPulse;
              this.ch1HaloSprite.scale.set(sc, sc, 1);
            }

            for (let i = 0; i < count; i++) {
              const i3 = i * 3;
              let tx, ty, tz;
              if (morphFactor <= 1) {
                const t = morphFactor;
                const rot = this.elapsed * 0.8 * t;
                const ox = orbitTargets[i3] * Math.cos(rot) - orbitTargets[i3 + 2] * Math.sin(rot);
                const oz = orbitTargets[i3] * Math.sin(rot) + orbitTargets[i3 + 2] * Math.cos(rot);
                tx = starOrigins[i3] + (ox - starOrigins[i3]) * t;
                ty = starOrigins[i3 + 1] + (orbitTargets[i3 + 1] - starOrigins[i3 + 1]) * t;
                tz = starOrigins[i3 + 2] + (oz - starOrigins[i3 + 2]) * t;
              } else {
                const t = morphFactor - 1;
                const rot = this.elapsed * 0.8 * (1 - t);
                const ox = orbitTargets[i3] * Math.cos(rot) - orbitTargets[i3 + 2] * Math.sin(rot);
                const oz = orbitTargets[i3] * Math.sin(rot) + orbitTargets[i3 + 2] * Math.cos(rot);
                tx = ox + (heartTargets[i3] * beat - ox) * t;
                ty = orbitTargets[i3 + 1] + (heartTargets[i3 + 1] * beat - orbitTargets[i3 + 1]) * t;
                tz = oz + (heartTargets[i3 + 2] * beat - oz) * t;
              }

              arr[i3] += (tx - arr[i3]) * 0.14;
              arr[i3 + 1] += (ty - arr[i3 + 1]) * 0.14;
              arr[i3 + 2] += (tz - arr[i3 + 2]) * 0.14;
            }
            posAttr.needsUpdate = true;
            if (heartBeating) this.ch1Particles.rotation.y = Math.sin(this.elapsed * 0.55) * 0.2;
          }

          if (this.state.chapter === 2 && this.ch2Objects) {
            this.ch2Objects.forEach((obj) => {
              const isSelected = this.state.activeMemoryId === obj.userData.id;
              const p = obj.userData.phase;

              if (!isSelected && this.state.activeMemoryId === null) {
                obj.position.y = obj.userData.home.y + Math.sin(this.elapsed * 1.15 + p) * 0.16;
                obj.rotation.y += dt * 0.36;
                obj.rotation.z = Math.sin(this.elapsed * 0.75 + p) * 0.14;
              } else if (isSelected) {
                obj.rotation.y += dt * 0.55;
              }

              if (obj.userData.hotspot && obj.userData.hotspot.classList.contains('active')) {
                const proj = obj.position.clone().project(this.camera);
                const sx = (proj.x * 0.5 + 0.5) * window.innerWidth;
                const sy = (-proj.y * 0.5 + 0.5) * window.innerHeight;
                obj.userData.hotspot.style.transform = `translate3d(calc(${sx}px - 50%), calc(${sy}px - 50%), 0)`;
              }
            });
          }

          if (this.state.chapter === 3 && this.ch3HeartPoints && this.ch3Data) {
            const posAttr = this.ch3HeartPoints.geometry.attributes.position;
            const arr = posAttr.array;
            const { scatterOrigins, heartBase, phases, drawOrder, assembleProgress, orbitSpeedMult } = this.ch3Data;
            const count = arr.length / 3;
            const sc = this.getResponsiveSceneScale();

            this.heartbeatPhase += dt * 2.55;
            const lub = Math.pow(Math.max(0, Math.sin(this.heartbeatPhase)), 6);
            const dub = Math.pow(Math.max(0, Math.sin(this.heartbeatPhase - 0.58)), 8) * 0.65;
            const beatStrength = (lub + dub) * assembleProgress;
            const pulse = 1 + beatStrength * 0.115;

            const floatY = Math.sin(this.elapsed * 1.25) * 0.14 * assembleProgress;
            const swayZ = Math.sin(this.elapsed * 0.9) * 0.045 * assembleProgress;

            for (let i = 0; i < count; i++) {
              const i3 = i * 3;
              const ph = phases[i];

              const localP = THREE.MathUtils.clamp((assembleProgress - drawOrder[i] * 0.45) / 0.55, 0, 1);
              const smoothP = localP * localP * (3 - 2 * localP);

              const swirlAngle = (1 - smoothP) * (this.elapsed * 0.9 + ph);
              const sx = scatterOrigins[i3] * Math.cos(swirlAngle) - scatterOrigins[i3 + 2] * Math.sin(swirlAngle);
              const sz = scatterOrigins[i3] * Math.sin(swirlAngle) + scatterOrigins[i3 + 2] * Math.cos(swirlAngle);
              const sy = scatterOrigins[i3 + 1] + Math.sin(this.elapsed * 1.5 + ph) * 0.25 * (1 - smoothP);

              const shimmerX = Math.sin(this.elapsed * 2.2 + ph) * 0.045 * smoothP;
              const shimmerY = Math.cos(this.elapsed * 1.9 + ph * 1.3) * 0.045 * smoothP;
              const shimmerZ = Math.sin(this.elapsed * 2.4 + ph * 0.8) * 0.06 * smoothP;

              const hx = (heartBase[i3] + shimmerX) * pulse;
              const hy = (heartBase[i3 + 1] + shimmerY + floatY) * pulse;
              const hz = (heartBase[i3 + 2] + shimmerZ) * pulse;

              const tx = sx + (hx - sx) * smoothP;
              const ty = sy + (hy - sy) * smoothP;
              const tz = sz + (hz - sz) * smoothP;

              arr[i3] += (tx - arr[i3]) * 0.18;
              arr[i3 + 1] += (ty - arr[i3 + 1]) * 0.18;
              arr[i3 + 2] += (tz - arr[i3 + 2]) * 0.18;
            }
            posAttr.needsUpdate = true;

            this.ch3HeartPoints.rotation.y = Math.sin(this.elapsed * 0.65) * 0.14 * assembleProgress;
            this.ch3HeartPoints.rotation.z = swayZ;

            if (this.ch3Aura && this.ch3Aura.material.opacity > 0.01) {
              const auraScale = (0.5 + assembleProgress * 4.9 + beatStrength * 1.15 + Math.sin(this.elapsed * 1.7) * 0.25) * sc;
              this.ch3Aura.position.y = 0.65 + floatY;
              this.ch3Aura.scale.set(auraScale, auraScale, 1);
            }

            if (this.ch3NameSprite && this.ch3NameSprite.material.opacity > 0.01) {
              const namePulse = 1 + beatStrength * 0.055;
              this.ch3NameSprite.position.y = 0.72 + floatY;
              this.ch3NameSprite.scale.set(3.45 * sc * namePulse, 0.86 * sc * namePulse, 1);
            }

            if (this.ch3CrownStar && this.ch3CrownStar.material.opacity > 0.01) {
              const starPulse = 1 + beatStrength * 0.28 + Math.sin(this.elapsed * 3.4) * 0.14;
              this.ch3CrownStar.position.y = 2.35 * sc + 0.65 + floatY;
              this.ch3CrownStar.scale.set(1.15 * starPulse, 1.15 * starPulse, 1);
              this.ch3CrownStar.material.rotation = this.elapsed * 0.6;
            }

            this.ch3Orbits.forEach((orbit, idx) => {
              orbit.rotation.y += dt * orbit.userData.speed * orbitSpeedMult;
              orbit.position.y = 0.65 + floatY * 0.75 + Math.sin(this.elapsed * 1.1 + idx) * 0.04;
            });

            if (this.ch3WordSprites) {
              const worldPos = new THREE.Vector3();
              this.ch3WordSprites.forEach((sp, i) => {
                sp.getWorldPosition(worldPos);
                const depthFactor = THREE.MathUtils.clamp((worldPos.z + 3.5) / 7, 0.28, 1);
                const wordWave = 1 + Math.sin(this.elapsed * 2.0 + i) * 0.05;
                sp.scale.set(2.0 * sc * wordWave, 0.5 * sc * wordWave, 1);
                if (this.state.chapter3Phase === 'narrative' || this.state.chapter3Phase === 'eternal') {
                  sp.material.opacity = depthFactor * assembleProgress * (this.state.chapter3Phase === 'eternal' ? 0.68 : 0.85);
                }
              });
            }

            if (Math.random() < dt * (this.state.chapter3Phase === 'eternal' ? 0.55 : 0.25)) {
              this.spawnShootingStar();
            }
          }

          this.renderer.render(this.scene, this.camera);
        }

        bindEvents() {
          const onPointerDown = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            this.pointer.isDown = true;
            this.pointer.startX = clientX;
            this.pointer.startY = clientY;
          };

          const onPointerMove = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            this.pointer.targetX = (clientX / window.innerWidth) * 2 - 1;
            this.pointer.targetY = -(clientY / window.innerHeight) * 2 + 1;
          };

          const onPointerUp = (e) => {
            if (!this.pointer.isDown) return;
            this.pointer.isDown = false;
            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            const dist = Math.hypot(clientX - this.pointer.startX, clientY - this.pointer.startY);

            if (dist < 18) {
              const hitMemory = this.checkChapter2Raycast(clientX, clientY);
              if (!hitMemory && e.target === this.dom.canvas) {
                const ndcX = (clientX / window.innerWidth) * 2 - 1;
                const ndcY = -(clientY / window.innerHeight) * 2 + 1;
                this.spawnTouchSpark(ndcX, ndcY);
              }
            }
          };

          window.addEventListener('pointerdown', onPointerDown, { passive: true });
          window.addEventListener('pointermove', onPointerMove, { passive: true });
          window.addEventListener('pointerup', onPointerUp, { passive: true });

          this.dom.motionToggle.addEventListener('click', async () => {
            if (this.deviceTilt.enabled) {
              this.deviceTilt.enabled = false;
              this.deviceTilt.x = 0;
              this.deviceTilt.y = 0;
              this.dom.motionToggle.classList.remove('active');
              return;
            }
            try {
              if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                const res = await DeviceOrientationEvent.requestPermission();
                if (res !== 'granted') return;
              }
              window.addEventListener('deviceorientation', (ev) => {
                if (!this.deviceTilt.enabled) return;
                this.deviceTilt.x = THREE.MathUtils.clamp(ev.gamma || 0, -25, 25) / 25;
                this.deviceTilt.y = -THREE.MathUtils.clamp((ev.beta || 45) - 45, -25, 25) / 25;
              });
              this.deviceTilt.enabled = true;
              this.dom.motionToggle.classList.add('active');
            } catch (err) {}
          });

          this.dom.memBackBtn.addEventListener('click', () => { this.closeMemory(); });
          this.dom.replayBtn.addEventListener('click', () => { this.replayExperience(); });

          const onResize = () => {
            if (!this.renderer || !this.camera) return;
            this.camera.fov = this.getResponsiveFOV();
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, this.settings.dpr));
            this.renderer.setSize(window.innerWidth, window.innerHeight);
          };

          window.addEventListener('resize', onResize);
          window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
        }

        clearGroup(group) {
          while (group.children.length > 0) {
            const child = group.children[0];
            group.remove(child);
            if (child.geometry) child.geometry.dispose();
            if (child.material) {
              if (child.material.map) child.material.map.dispose();
              child.material.dispose();
            }
          }
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        try {
          if (typeof THREE === 'undefined') throw new Error('Three.js not loaded');
          window.__loveExperience = new CinematicLoveExperience();
        } catch (err) {
          const story = document.getElementById('story-line');
          const btn = document.getElementById('primary-btn');
          if (story && btn) {
            story.textContent = 'في مكان ما، بين كل هذه النجوم... هناك شيء أردت أن أصنعه لك.';
            story.classList.add('active');
            btn.textContent = 'أحبك يا LINA';
            btn.classList.add('visible');
          }
        }
      });
    })();
  </script>
</body>
