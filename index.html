<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03040a"><title>إلى قلبك — رحلة عبر ثلاثة عوالم</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="top-ui">
  <div class="chapter-dots" aria-label="مراحل الرحلة"><i data-dot="1"></i><i data-dot="2"></i><i data-dot="3"></i></div>
  <button id="soundToggle" class="icon-btn" aria-label="تشغيل أو إيقاف الصوت"><span class="sound-bars"><b></b><b></b><b></b><b></b></span></button>
</div>
<div id="copy" class="copy" aria-live="polite"></div>
<div id="actions" class="actions"></div>
<div id="memoryPanel" class="memory-panel" aria-hidden="true">
  <div class="memory-heading" id="memoryTitle"></div><div class="memory-message" id="memoryMessage"></div>
  <button id="memoryBack" class="glass-btn">العودة إلى العالم</button>
</div>
<div id="toast" class="toast"></div>
<script src="js/config.js"></script><script src="js/main.js"></script>
</body></html>
