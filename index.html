<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#03040A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>إلى قلبك — رحلة عبر ثلاثة عوالم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep-black: #03040A;
      --cosmic-navy: #07101D;
      --midnight-purple: #17102B;
      --nebula-violet: #594083;
      --dream-lavender: #A18BEA;
      --soft-rose: #DFA5C8;
      --rose-gold: #D5A88D;
      --moonlight-blue: #9BBEEA;
      --pearl-white: #FFFFFF;
      --warm-light: #FFF5E4;

      --safe-top: env(safe-area-inset-top, 16px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
      --safe-left: env(safe-area-inset-left, 16px);
      --safe-right: env(safe-area-inset-right, 16px);

      --font-display: 'Alexandria', 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
      --font-body: 'IBM Plex Sans Arabic', 'Alexandria', system-ui, -apple-system, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, var(--cosmic-navy) 0%, var(--deep-black) 78%);
      color: var(--pearl-white);
      font-family: var(--font-body);
      touch-action: none;
      position: fixed;
      inset: 0;
    }

    #experience-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      transition: filter 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #experience-canvas.is-blurred {
      filter: blur(6px) brightness(0.72);
    }

    .vignette-layer {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 50%, transparent 45%, rgba(3, 4, 10, 0.72) 100%),
        linear-gradient(180deg, rgba(3, 4, 10, 0.55) 0%, transparent 18%, transparent 72%, rgba(3, 4, 10, 0.82) 100%);
    }

    .top-hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 10px) calc(var(--safe-right) + 18px) 10px calc(var(--safe-left) + 18px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .top-hud.visible {
      opacity: 1;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(7, 16, 29, 0.58);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--pearl-white);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .icon-btn.active {
      border-color: rgba(223, 165, 200, 0.58);
      box-shadow: 0 0 18px rgba(161, 139, 234, 0.28);
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chapter-dots {
      display: flex;
      align-items: center;
      gap: 12px;
      direction: ltr;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(3, 4, 10, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .chapter-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.28);
      transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .chapter-dot.completed {
      background: rgba(223, 165, 200, 0.75);
    }

    .chapter-dot.active {
      width: 10px;
      height: 10px;
      background: var(--warm-light);
      box-shadow: 0 0 12px var(--warm-light), 0 0 24px var(--dream-lavender);
    }

    .narrative-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--safe-top) + 64px) clamp(18px, 5vw, 48px) calc(var(--safe-bottom) + 20px);
      pointer-events: none;
      text-align: center;
    }

    .chapter-header {
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1), transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
      padding: 8px 22px;
      border-radius: 22px;
      background: rgba(3, 4, 10, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chapter-header.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .chapter-label {
      font-family: var(--font-display);
      font-size: clamp(0.88rem, 3.2vw, 1.05rem);
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--rose-gold);
      margin-bottom: 4px;
    }

    .chapter-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(1.4rem, 5.4vw, 1.95rem);
      color: var(--pearl-white);
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.98);
    }

    .story-stage {
      width: 100%;
      max-width: 640px;
      min-height: 136px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-top: auto;
      margin-bottom: clamp(10px, 2.4vh, 22px);
    }

    .story-line {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: clamp(1.38rem, 5.4vw, 2.05rem);
      line-height: 1.75;
      color: var(--pearl-white);
      text-shadow:
        0 2px 6px rgba(0, 0, 0, 1),
        0 4px 26px rgba(0, 0, 0, 0.98),
        0 0 38px rgba(89, 64, 131, 0.65);
      background: radial-gradient(ellipse at center, rgba(3, 4, 10, 0.82) 0%, rgba(3, 4, 10, 0.52) 68%, transparent 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 26px;
      opacity: 0;
      filter: blur(6px);
      transform: translateY(14px) scale(0.985);
      transition:
        opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.85s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
      padding: 12px 24px;
      max-width: 100%;
    }

    .story-line.active {
      opacity: 1;
      filter: blur(0px);
      transform: translateY(0) scale(1);
    }

    .story-line.exiting {
      opacity: 0;
      filter: blur(5px);
      transform: translateY(-12px) scale(0.99);
    }

    .story-line.love-climax {
      font-size: clamp(2.45rem, 9.6vw, 3.85rem);
      font-weight: 700;
      color: var(--warm-light);
      text-shadow:
        0 0 24px rgba(255, 245, 228, 0.92),
        0 0 54px rgba(223, 165, 200, 0.82),
        0 4px 24px rgba(0, 0, 0, 1);
    }

    .action-dock {
      min-height: 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
      width: 100%;
      z-index: 12;
    }

    .cinematic-btn {
      position: relative;
      min-width: 224px;
      min-height: 54px;
      padding: 14px 36px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.36);
      background: rgba(13, 18, 36, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--pearl-white);
      font-family: var(--font-display);
      font-size: clamp(1.12rem, 4.4vw, 1.3rem);
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
      opacity: 0;
      transform: translateY(14px) scale(0.98);
      pointer-events: none;
      box-shadow:
        0 0 26px rgba(161, 139, 234, 0.22),
        inset 0 0 18px rgba(255, 245, 228, 0.08);
      transition:
        opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.4s ease,
        box-shadow 0.4s ease;
    }

    .cinematic-btn.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .cinematic-btn.pressed {
      transform: scale(0.97) !important;
      border-color: rgba(255, 245, 228, 0.85);
      box-shadow:
        0 0 36px rgba(223, 165, 200, 0.45),
        inset 0 0 24px rgba(255, 245, 228, 0.2);
    }

    .cinematic-btn::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 999px;
      padding: 1px;
      background: conic-gradient(
        from var(--btn-angle, 0deg),
        transparent 0%,
        transparent 72%,
        rgba(255, 245, 228, 0.95) 86%,
        rgba(223, 165, 200, 0.75) 94%,
        transparent 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: spinBorder 4.5s linear infinite;
      pointer-events: none;
    }

    @property --btn-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes spinBorder {
      to { --btn-angle: 360deg; }
    }

    .btn-ripple {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 245, 228, 0.65) 0%, rgba(223, 165, 200, 0.2) 55%, transparent 75%);
      transform: translate(-50%, -50%) scale(0);
      animation: rippleExpand 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: none;
    }

    @keyframes rippleExpand {
      to {
        transform: translate(-50%, -50%) scale(4.2);
        opacity: 0;
      }
    }

    .memory-progress-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: none;
    }

    .memory-progress-bar.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .mem-node {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(223, 165, 200, 0.55);
      background: rgba(23, 16, 43, 0.65);
      transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mem-node.unlocked {
      background: var(--warm-light);
      border-color: var(--warm-light);
      box-shadow: 0 0 12px var(--warm-light), 0 0 22px var(--soft-rose);
      transform: scale(1.18);
    }

    .mem-node.converged {
      box-shadow: 0 0 18px var(--warm-light), 0 0 34px var(--dream-lavender);
    }

    .memory-hotspots {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
    }

    .memory-hotspot {
      position: fixed;
      left: 0;
      top: 0;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: transparent;
      border: none;
      cursor: pointer;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 4px;
      opacity: 0;
      transition: opacity 0.55s ease;
      touch-action: manipulation;
    }

    .memory-hotspot.active {
      opacity: 1;
      pointer-events: auto;
    }

    .memory-hotspot-label {
      position: relative;
      top: 14px;
      white-space: nowrap;
      font-family: var(--font-display);
      font-size: clamp(0.96rem, 3.8vw, 1.14rem);
      font-weight: 600;
      color: var(--pearl-white);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 1);
      background: rgba(7, 16, 29, 0.84);
      padding: 6px 15px;
      border-radius: 999px;
      border: 1px solid rgba(223, 165, 200, 0.48);
      transition: border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
    }

    .memory-hotspot.opened .memory-hotspot-label {
      border-color: rgba(255, 245, 228, 0.78);
      color: var(--warm-light);
      background: rgba(23, 16, 43, 0.88);
    }

    .memory-reader {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 74px) clamp(22px, 6vw, 56px) calc(var(--safe-bottom) + 34px);
      background: rgba(3, 4, 10, 0.68);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      text-align: center;
    }

    .memory-reader.open {
      opacity: 1;
      pointer-events: auto;
    }

    .memory-reader-title {
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 4.4vw, 1.42rem);
      font-weight: 600;
      color: var(--rose-gold);
      letter-spacing: 0.05em;
      background: rgba(7, 16, 29, 0.75);
      padding: 6px 18px;
      border-radius: 999px;
    }

    .memory-reader-body {
      max-width: 540px;
      font-family: var(--font-display);
      font-weight: 500;
      font-size: clamp(1.42rem, 5.6vw, 2.05rem);
      line-height: 1.8;
      color: var(--pearl-white);
      text-shadow: 0 2px 24px rgba(0, 0, 0, 1);
      background: rgba(7, 16, 29, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 20px 24px;
      margin-top: auto;
      margin-bottom: 24px;
      transform: translateY(14px);
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .memory-reader.open .memory-reader-body {
      transform: translateY(0);
    }

    .subtle-btn {
      min-width: 164px;
      min-height: 50px;
      padding: 12px 30px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      background: rgba(7, 16, 29, 0.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--pearl-white);
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 4.2vw, 1.2rem);
      font-weight: 600;
      cursor: pointer;
    }

    .subtle-btn:active {
      transform: scale(0.96);
    }

    .replay-btn {
      min-width: 210px;
      min-height: 50px;
      padding: 12px 28px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(7, 16, 29, 0.76);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--pearl-white);
      font-family: var(--font-display);
      font-size: clamp(1rem, 4vw, 1.15rem);
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 1.4s ease, transform 1s ease;
    }

    .replay-btn.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .replay-btn:active {
      transform: scale(0.96);
    }

    .gesture-hint {
      font-family: var(--font-display);
      font-size: clamp(0.96rem, 3.8vw, 1.12rem);
      font-weight: 500;
      color: var(--pearl-white);
      background: rgba(3, 4, 10, 0.68);
      padding: 6px 16px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    .gesture-hint.visible {
      opacity: 1;
    }

    @media (max-height: 540px) {
      .narrative-layer {
        padding-top: calc(var(--safe-top) + 48px);
        padding-bottom: calc(var(--safe-bottom) + 14px);
      }
      .story-stage {
        min-height: 76px;
        margin-bottom: 8px;
      }
      .story-line {
        font-size: clamp(1.2rem, 4.2vw, 1.55rem);
        line-height: 1.55;
      }
      .action-dock {
        min-height: 52px;
        gap: 8px;
      }
      .cinematic-btn {
        min-height: 46px;
        padding: 9px 26px;
      }
    }
  </style>
</head>
<body>

  <canvas id="experience-canvas" aria-label="مشهد تفاعلي ثلاثي الأبعاد"></canvas>
  <div class="vignette-layer" aria-hidden="true"></div>

  <header class="top-hud" id="top-hud">
    <div class="chapter-dots" id="chapter-dots" role="status" aria-label="مؤشر الفصول">
      <span class="chapter-dot active" data-chapter="1"></span>
      <span class="chapter-dot" data-chapter="2"></span>
      <span class="chapter-dot" data-chapter="3"></span>
    </div>

    <div class="hud-controls">
      <button type="button" class="icon-btn" id="motion-toggle" aria-label="تفعيل استشعار الحركة">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="narrative-layer" id="narrative-layer">
    <div class="chapter-header" id="chapter-header">
      <div class="chapter-label" id="chapter-label">الفصل الأول</div>
      <h1 class="chapter-title" id="chapter-title">رسالة من بين النجوم</h1>
    </div>

    <div class="story-stage" aria-live="polite">
      <p class="story-line" id="story-line"></p>
    </div>

    <div class="action-dock" id="action-dock">
      <div class="memory-progress-bar" id="memory-progress-bar" aria-label="تقدم الذكريات">
        <span class="mem-node" data-mem="0"></span>
        <span class="mem-node" data-mem="1"></span>
        <span class="mem-node" data-mem="2"></span>
        <span class="mem-node" data-mem="3"></span>
        <span class="mem-node" data-mem="4"></span>
      </div>

      <p class="gesture-hint" id="gesture-hint"></p>

      <button type="button" class="cinematic-btn" id="primary-btn">ابدئي الرحلة</button>
      <button type="button" class="replay-btn" id="replay-btn">أعيد الرحلة من البداية</button>
    </div>
  </main>

  <div class="memory-hotspots" id="memory-hotspots" aria-label="عناصر الذكريات"></div>

  <section class="memory-reader" id="memory-reader" aria-hidden="true">
    <div class="memory-reader-title" id="memory-reader-title"></div>
    <p class="memory-reader-body" id="memory-reader-body"></p>
    <button type="button" class="subtle-btn" id="memory-back-btn">العودة</button>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    (function () {
      'use strict';

      const CONFIG = {
        recipientName: 'LINA',
        palette: {
          deepBlack: 0x03040A,
          cosmicNavy: 0x07101D,
          midnightPurple: 0x17102B,
          nebulaViolet: 0x594083,
          dreamLavender: 0xA18BEA,
          softRose: 0xDFA5C8,
          roseGold: 0xD5A88D,
          moonlightBlue: 0x9BBEEA,
          pearlWhite: 0xFFFFFF,
          warmLight: 0xFFF5E4
        },
        memories: [
          {
            id: 0,
            code: '01',
            title: 'وجودك',
            text: 'هناك أشخاص لا يحتاجون\nإلى فعل شيء استثنائي،\nيكفي وجودهم\nليصبح اليوم أخف.',
            color: 0xFFF5E4
          },
          {
            id: 1,
            code: '02',
            title: 'ضحكتك',
            text: 'بعض الأصوات\nقادرة على تغيير شعور يوم كامل،\nحتى من دون أن تعرف كيف فعلت ذلك.',
            color: 0xDFA5C8
          },
          {
            id: 2,
            code: '03',
            title: 'تفاصيلك',
            text: 'أحيانًا تكون الأشياء الصغيرة\nهي أكثر ما يبقى في الذاكرة.',
            color: 0xA18BEA
          },
          {
            id: 3,
            code: '04',
            title: 'اللحظات الهادئة',
            text: 'ليست كل اللحظات الجميلة\nبحاجة إلى كلمات،\nبعضها يكفي\nأن يُعاش بهدوء.',
            color: 0x9BBEEA
          },
          {
            id: 4,

      class PerformanceManager {
        constructor() {
          this.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
          this.reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          this.tier = this.detectTier();
          this.fpsHistory = [];
        }

        detectTier() {
          const cores = navigator.hardwareConcurrency || 4;
          const mem = navigator.deviceMemory || 4;
          if (this.reducedMotion) return 'LOW';
          if (this.isMobile) {
            if (cores <= 4 && mem <= 3) return 'LOW';
            if (cores <= 6 || mem <= 4) return 'MEDIUM';
            return 'HIGH';
          }
          return cores >= 4 ? 'HIGH' : 'MEDIUM';
        }

        getSettings() {
          if (this.tier === 'LOW') {
            return { dpr: 1, starCount: 850, heartParticles: 1700, dustParticles: 180, orbParticles: 70, orbitalWordCount: 6 };
          }
          if (this.tier === 'MEDIUM') {
            return { dpr: Math.min(window.devicePixelRatio || 1, 1.5), starCount: 1500, heartParticles: 2700, dustParticles: 300, orbParticles: 120, orbitalWordCount: 8 };
          }
          return { dpr: Math.min(window.devicePixelRatio || 1, 2), starCount: 2400, heartParticles: 3900, dustParticles: 450, orbParticles: 170, orbitalWordCount: 10 };
        }

        recordFrame(dt) {
          if (dt <= 0 || dt > 0.25) return;
          this.fpsHistory.push(1 / dt);
          if (this.fpsHistory.length > 90) {
            const avg = this.fpsHistory.reduce((a, b) => a + b, 0) / this.fpsHistory.length;
            this.fpsHistory = [];
            if (avg < 26 && this.tier === 'HIGH') this.tier = 'MEDIUM';
            else if (avg < 22 && this.tier === 'MEDIUM') this.tier = 'LOW';
          }
        }
      }

      class AnimationManager {
        constructor() {
          this.timers = new Set();
          this.tweens = [];
        }

        schedule(fn, delayMs) {
          const id = setTimeout(() => {
            this.timers.delete(id);
            fn();
          }, delayMs);
          this.timers.add(id);
          return id;
        }

        tween({ from, to, duration, ease = 'easeInOutCubic', onUpdate, onComplete }) {
          const obj = { from, to, duration: Math.max(duration, 0.001), elapsed: 0, ease, onUpdate, onComplete, cancelled: false };
          this.tweens.push(obj);
          return obj;
        }

        update(dt) {
          for (let i = this.tweens.length - 1; i >= 0; i--) {
            const t = this.tweens[i];
            if (t.cancelled) {
              this.tweens.splice(i, 1);
              continue;
            }
            t.elapsed += dt;
            const rawP = Math.min(t.elapsed / t.duration, 1);
            const p = this.applyEase(rawP, t.ease);
            const val = t.from + (t.to - t.from) * p;
            if (t.onUpdate) t.onUpdate(val, p);
            if (rawP >= 1) {
              this.tweens.splice(i, 1);
              if (t.onComplete) t.onComplete();
            }
          }
        }

        applyEase(t, type) {
          switch (type) {
            case 'linear': return t;
            case 'easeOutCubic': return 1 - Math.pow(1 - t, 3);
            case 'easeInCubic': return t * t * t;
            case 'easeOutQuart': return 1 - Math.pow(1 - t, 4);
            case 'easeInOutQuint':
              return t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2;
            case 'easeInOutCubic':
            default:
              return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          }
        }

        clearAll() {
          this.timers.forEach((id) => clearTimeout(id));
          this.timers.clear();
          this.tweens.forEach((t) => { t.cancelled = true; });
          this.tweens = [];
        }
      }

      function createGlowTexture(innerColor = '#FFF5E4', midColor = '#DFA5C8', outerColor = 'rgba(89, 64, 131, 0)') {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        grad.addColorStop(0.0, '#FFFFFF');
        grad.addColorStop(0.18, innerColor);
        grad.addColorStop(0.45, midColor);
        grad.addColorStop(1.0, outerColor);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 128, 128);
        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        return tex;
      }

      function createOrbitalWordTexture(text) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 512, 128);

        ctx.font = '600 46px "Alexandria", "IBM Plex Sans Arabic", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(text, 256, 64);

        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        return tex;
      }

      function createCrispNameTexture(name) {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 1024, 256);

        ctx.font = '700 116px "Alexandria", system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const letters = name.split('');
        const letterSpacing = 128;
        const startX = 512 - ((letters.length - 1) * letterSpacing) / 2;

        ctx.shadowColor = 'rgba(255, 245, 228, 0.9)';
        ctx.shadowBlur = 24;
        ctx.fillStyle = '#FFFFFF';

        letters.forEach((ch, idx) => {
          ctx.fillText(ch, startX + idx * letterSpacing, 128);
        });

        const tex = new THREE.CanvasTexture(canvas);
        tex.needsUpdate = true;
        return tex;
      }

      function sampleHeartPoint(scale = 1.0, shellOnly = true) {
        const t = Math.random() * Math.PI * 2;
        const x0 = 16 * Math.pow(Math.sin(t), 3);
        const y0 = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

        const r = shellOnly ? (0.94 + Math.random() * 0.06) : (0.78 + Math.random() * 0.16);
        const zBand = (Math.random() - 0.5) * 0.75 * r;

        return {
          x: (x0 * r) * 0.155 * scale,
          y: (y0 * r + 1.4) * 0.155 * scale,
          z: zBand * scale
        };
      }

      class CinematicLoveExperience {
        constructor() {
          this.perf = new PerformanceManager();
          this.settings = this.perf.getSettings();
          this.anim = new AnimationManager();

          this.state = {
            chapter: 0,
            isTransitioning: false,
            openedMemories: new Set(),
            activeMemoryId: null,
            allMemoriesConverged: false,
            chapter3Phase: 'idle'
          };

          this.pointer = { x: 0, y: 0, targetX: 0, targetY: 0, isDown: false, startX: 0, startY: 0 };
          this.deviceTilt = { enabled: false, x: 0, y: 0 };
          this.raycaster = new THREE.Raycaster();
          this.textTimer = null;

          this.clock = new THREE.Clock();
          this.elapsed = 0;
          this.heartbeatPhase = 0;

          this.dom = {
            canvas: document.getElementById('experience-canvas'),

          };

          this.initThree();

          this.startIntroSequence();
